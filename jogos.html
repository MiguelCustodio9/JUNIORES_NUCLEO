<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SGC · Jogos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.1/jspdf.plugin.autotable.min.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/pdf-utils.js"></script>
  <script>renderShell("Jogos");</script>

  <div class="modal-backdrop" id="modalJogo">
    <div class="modal">
      <div class="modal-header"><h3>Novo jogo</h3><button class="close-x" onclick="fecharModalJogo()">✕</button></div>
      <form id="formJogo">
        <div class="grid grid-2">
          <div class="field"><label>Competição</label><input type="text" id="j_competicao"></div>
          <div class="field"><label>Jornada</label><input type="text" id="j_jornada"></div>
          <div class="field"><label>Adversário</label><input type="text" id="j_adversario_nome"></div>
          <div class="field"><label>Sigla do adversário</label><input type="text" id="j_adversario_sigla"></div>
          <div class="field"><label>Logótipo do adversário (URL)</label><input type="text" id="j_adversario_logo_url"></div>
          <div class="field"><label>Local de realização</label><input type="text" id="j_local"></div>
          <div class="field"><label>Localidade</label><input type="text" id="j_localidade"></div>
          <div class="field"><label>Data do jogo</label><input type="date" id="j_data_jogo"></div>
          <div class="field"><label>Duração de cada parte</label>
            <select id="j_duracao_parte"><option value="20">2 partes de 20 minutos</option><option value="35">2 partes de 35 minutos</option></select>
          </div>
        </div>
        <div style="display:flex;justify-content:flex-end;gap:10px">
          <button type="button" class="btn btn-outline" onclick="fecharModalJogo()">Cancelar</button>
          <button type="submit" class="btn">Criar jogo</button>
        </div>
      </form>
    </div>
  </div>

  <button class="fab" onclick="abrirModalJogo()">+</button>

  <script src="js/jogos.js"></script>
  <script>iniciarJogos();</script>
</body>
</html>
