<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SGC · Início</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/sidebar.js"></script>

  <script>
    renderShell("Início");
  </script>

  <script>
    async function carregarResumo() {
      const c = pageContent();
      c.innerHTML = `
        <div class="grid grid-4" id="cardsResumo"></div>
        <div class="grid grid-2" style="margin-top:6px">
          <div class="card">
            <div class="card-header"><h3>Atalhos</h3></div>
            <div style="display:flex;flex-wrap:wrap;gap:10px">
              <a class="btn" href="jogos.html">+ Novo jogo</a>
              <a class="btn btn-outline" href="treinos.html">+ Novo treino</a>
              <a class="btn btn-outline" href="avaliacoes.html">+ Avaliação física</a>
              <a class="btn btn-outline" href="plantel.html">+ Atleta</a>
            </div>
          </div>
          <div class="card">
            <div class="card-header"><h3>Sobre o SGC</h3></div>
            <p style="color:var(--cinza-500);font-size:14px;line-height:1.6">
              Gere jogos, treinos, avaliações físicas, plantel, estatísticas e presenças
              do Núcleo num único sítio. Usa o menu lateral para navegar entre secções.
            </p>
          </div>
        </div>
      `;

      const [{ count: nAtletas }, { count: nJogos }, { count: nTreinos }, { count: nAvaliacoes }] = await Promise.all([
        supabaseClient.from("atletas").select("*", { count: "exact", head: true }),
        supabaseClient.from("jogos").select("*", { count: "exact", head: true }),
        supabaseClient.from("treinos").select("*", { count: "exact", head: true }),
        supabaseClient.from("avaliacoes_fisicas").select("*", { count: "exact", head: true }),
      ]);

      document.getElementById("cardsResumo").innerHTML = `
        <div class="stat-pill"><div class="num">${nAtletas ?? 0}</div><div class="lbl">Atletas</div></div>
        <div class="stat-pill"><div class="num">${nJogos ?? 0}</div><div class="lbl">Jogos</div></div>
        <div class="stat-pill"><div class="num">${nTreinos ?? 0}</div><div class="lbl">Treinos</div></div>
        <div class="stat-pill"><div class="num">${nAvaliacoes ?? 0}</div><div class="lbl">Avaliações físicas</div></div>
      `;
    }
    carregarResumo();
  </script>
</body>
</html>
