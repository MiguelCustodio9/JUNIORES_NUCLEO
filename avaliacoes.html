<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SGC · Avaliações Físicas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.1/jspdf.plugin.autotable.min.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/pdf-utils.js"></script>
  <script>renderShell("Avaliações Físicas");</script>

  <div class="modal-backdrop" id="modalAvaliacao">
    <div class="modal">
      <div class="modal-header"><h3>Nova avaliação</h3><button class="close-x" onclick="fecharModalAvaliacao()">✕</button></div>
      <form id="formAvaliacao">
        <div class="field"><label>Título</label><input type="text" id="av_titulo" required></div>
        <div class="field"><label>Dia da avaliação</label><input type="date" id="av_data"></div>
        <div style="display:flex;justify-content:flex-end;gap:10px">
          <button type="button" class="btn btn-outline" onclick="fecharModalAvaliacao()">Cancelar</button>
          <button type="submit" class="btn">Criar avaliação</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-backdrop" id="modalValores">
    <div class="modal" style="max-width:760px">
      <div class="modal-header"><h3 id="tituloValores">Valores</h3><button class="close-x" onclick="fecharModalValores()">✕</button></div>
      <form id="formValores"></form>
    </div>
  </div>

  <button class="fab" onclick="abrirModalAvaliacao()">+</button>

  <script src="js/avaliacoes.js"></script>
  <script>iniciarAvaliacoes();</script>
</body>
</html>
