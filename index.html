<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SGC · Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-wrap">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="login-card">
      <div class="login-badge">SC</div>
      <h2>SGC · Núcleo</h2>
      <p class="subtitle">Sistema de Gestão de Clube — Núcleo SCP Castelo Branco</p>
      <form id="loginForm">
        <div class="field">
          <label for="username">Utilizador</label>
          <input type="text" id="username" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-block" type="submit">Entrar</button>
        <div class="error-msg" id="errorMsg"></div>
      </form>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    if (getCurrentUser()) window.location.href = "dashboard.html";

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const errorEl = document.getElementById("errorMsg");
      errorEl.textContent = "";
      const res = await login(username, password);
      if (res.ok) {
        window.location.href = "dashboard.html";
      } else {
        errorEl.textContent = res.error;
      }
    });
  </script>
</body>
</html>
